    <meta name="description" content="Be in touch with us, our staff are friendly and await to here from you.">

<body>
    <header>
        <div class="logo">
            <img src="images/z-downriver.png" alt="Down The River">
        </div>

        <nav>

            <div class="grid-container">

                <ul>
                    <li class="grid-item"><a href="index.html">Home</a></li>
                    <li class=" grid-item"><a href="about.html">About Us</a></li>
                    <li class="grid-item"><a href="trips.html">Trips</a></li>
                    <li class="grid-item" id="current"><a href="contact.html">Contact Us</a></li>
                </ul>

            </div>

        </nav>

    </header>

    <main>
        <div class="contact">

            <h1>Down The River</h1>
            <h2>332 Marlborough Road</h2>
            <h2>Johannesburg</h2>
            <h2>Phone: +277-482-29679</h2>
            <h2>Email: <a href="mailto:sadf">zmakenda@byupathway.edu</a></h2>

        </div>

        <div class="information">

            <div class="map-frame">


                <iframe
                    src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3582.3183491138993!2d28.131707475289918!3d-26.121161177127828!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x1e9512936aed337d%3A0x5d936ec1a11fb168!2s332%20Marlborough%20Rd%2C%20Rembrandt%20Park%2C%20Johannesburg%2C%202090!5e0!3m2!1sen!2sza!4v1764440833800!5m2!1sen!2sza"></iframe>


            </div>

            <div>
                <form action="user-input">
                    <div class="form-group">
                        <label for="name">Name:</label>
                        <input type="text" id="name" name="name">
                    </div>

                    <div class="form-group">
                        <label for="email">Email:</label>
                        <input type="email" id="email" name="email">
                    </div>

                    <div class="form-group">

                        <div class="message-purpose"><label for="message-purpose">Message Purpose</label></div>

                        <div class="radio-group">
                            <input type="radio" id="general" name="purpose" checked>
                            <label for="general">General Inquiry</label><br>
                            <input type="radio" id="reservation" name="purpose">
                            <label for="reservation">Reservation Question</label><br>
                            <input type="radio" id="website" name="purpose">
                            <label for="website">Website Suggestion</label>
                        </div>

                    </div>



                    <div class="message-box">
                        <label for="message">Message</label>
                        <textarea id="message" name="message" placeholder="Type here..."></textarea>
                    </div>

                    <div class="checked"><input type="checkbox" id="subscribe" name="checked">



                        <label for="subscribe">Subscribe me to the monthly newsletter</label>


                    </div>

                    <div class="get-in-touch-baton"><button type="submit">Get in Touch!</button>
                    </div>

                </form>

            </div>

        </div>






        <section>


            <div class="content">

                <p></p>


                <h2>We Are Here to Serve You</h2>

                <p></p>


            </div>



            <article>

                <h2>We Are Here to Serve You</h2>


                <figure>
                    <img src="images/team_3_action.jpg" alt="Image 1">
                    <figcaption>The yellow</figcaption>
                </figure>
                <figure>
                    <img src="images/team_2_action.jpg" alt="Image 2">
                    <figcaption>The blue</figcaption>
                </figure>
                <figure>
                    <img src="images/team_one_action.jpg" alt="Image 3">
                    <figcaption>The red</figcaption>
                </figure>

            </article>


        </section>


    </main>
    <footer>
        <p>© 2025 🌲 Down The River 🌲 Zefa Binena Makenda</p>
        <nav class="socialmedia">
            <a href="https://www.facebook.com">
                <img src="images/facebook-square.svg" alt="Facebook"></a>
            <a href="https://www.linkedin.com">
                <img src="images/linkedin-square.svg" alt="Twitter"></a>
            <a href="https://www.instagram.com">
                <img src="images/instagram-square.svg" alt="Instagram"></a>
        </nav>
    </footer>
</body>

</html>
